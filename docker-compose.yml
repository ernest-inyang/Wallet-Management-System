version: "3.9"

services:
  app:
    build: .
    container_name: wallet-service

    ports:
      - "3000:3000"

    env_file:
      - .env

    depends_on:
      - mysql

  mysql:
    image: mysql:8

    container_name: wallet-db

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wallet_db

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: